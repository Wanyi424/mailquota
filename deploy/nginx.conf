# Place limit_req_zone in the nginx http context.
limit_req_zone $binary_remote_addr zone=mailquota_source:10m rate=10r/s;
server {
    listen 80;
    server_name mail.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name mail.example.com;
    ssl_certificate /etc/nginx/certs/mail.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/mail.example.com/privkey.pem;
    client_max_body_size 2m;
    # No query string or client email/IP logging for this dedicated service.
    access_log off;
    error_log /var/log/nginx/mailquota-error.log warn;
    error_page 429 = @source_limited;
    location @source_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"success":false,"code":"SOURCE_RATE_LIMIT","message":"请求过于频繁，请稍后重试","retry_after_seconds":1,"data":{"retry_after_seconds":1}}';
    }
    location / {
        limit_req zone=mailquota_source burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    location /health/ { deny all; }
}
