services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mailquota
      POSTGRES_USER: mailquota
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - mailquota-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailquota -d mailquota"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailquota:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mailquota:${POSTGRES_PASSWORD}@postgres:5432/mailquota

volumes:
  mailquota-postgres:
