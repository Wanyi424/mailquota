services:
  mailquota:
    build: .
    image: mailquota:local
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      STORAGE_DIR: /app/storage
      TRUST_PROXY: loopback,uniquelocal
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./storage:/app/storage
    stop_grace_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
