services:
  mailquota:
    build: .
    image: mailquota:local
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      TRUST_PROXY: loopback,uniquelocal
    ports:
      - "127.0.0.1:3578:3000"
    stop_grace_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL